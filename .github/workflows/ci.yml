name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Build core
        run: pnpm --filter @verified-counterparty/core build
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit + integration tests (coverage gate)
        run: pnpm test:coverage
      - name: Build web
        run: pnpm --filter web exec next build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: packages/core/coverage
          if-no-files-found: ignore

  live-testnet:
    name: Live Concordium testnet checks
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:live
